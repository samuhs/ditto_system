services:
  api:
    build:
      context: ./backend
      # Host-trusted CAs (make up/build fill certs/host-ca.pem) so builds and
      # downloads work behind VPNs that inspect HTTPS.
      additional_contexts:
        certs: ./certs
    volumes:
      - ./backend/prompts:/app/prompts
      - ./backend/config:/app/config
      - hf_cache:/root/.cache/huggingface
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://ditto:ditto@postgres:5432/ditto
      QDRANT_URL: http://qdrant:6333
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Host Ollama by default; `make llm-setup LLM_SERVER=docker` points it
      # at the ollama service below (http://ollama:11434/v1) via .env.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      # Memory profile (make memory-profile); empty overrides mean "use the profile".
      MEMORY_PROFILE: ${MEMORY_PROFILE:-standard}
      MAX_LOCAL_MODELS: ${MAX_LOCAL_MODELS:-}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-}
      MAX_EXPERIMENT_CONCURRENCY: ${MAX_EXPERIMENT_CONCURRENCY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ditto
      POSTGRES_PASSWORD: ditto
      POSTGRES_DB: ditto
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ditto"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  # Optional LLM server inside Docker (profile "ollama-docker", enabled by
  # `make llm-setup LLM_SERVER=docker`). CPU-only on macOS (no Metal in the
  # Docker VM), but its internal loopback lives in the VM, so it works on hosts
  # where a VPN/security agent breaks 127.0.0.1 connections.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama-docker"]
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_KEEP_ALIVE: 30m
    ports:
      # Host access (bench, curl). 11435 avoids clashing with a host Ollama.
      - "${OLLAMA_DOCKER_PORT:-11435}:11434"
    volumes:
      # A named volume by default; OLLAMA_MODELS_DIR=$HOME/.ollama/models reuses
      # models pulled on the host when the container cannot download them.
      - ${OLLAMA_MODELS_DIR:-ollama_models}:/root/.ollama/models

  frontend:
    build:
      context: ./frontend
      additional_contexts:
        certs: ./certs
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  ollama_models:
  pgdata:
  qdrantdata:
  hf_cache:
