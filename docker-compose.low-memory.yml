# Loaded through COMPOSE_FILE when MEMORY_PROFILE=low (make memory-profile).
# Caps the containers so the Docker VM leaves RAM for the LLM server on 8 GB machines.
services:
  api:
    mem_limit: 2g
  qdrant:
    # Measured at ~350 MB with one small base; 512m left too little headroom
    # for more bases (the container would be OOM-killed).
    mem_limit: 1g
  postgres:
    mem_limit: 256m
  frontend:
    mem_limit: 128m
  ollama:
    environment:
      OLLAMA_NUM_PARALLEL: 2
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_KV_CACHE_TYPE: q8_0
